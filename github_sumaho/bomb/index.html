<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ばくだん パス</title>
<!--
  ばくだん パス（2〜4にん）
  ・ばくだんを もっている ひとの スマホだけ ブルブル ふるえる
  ・スマホを なげる ように ふると、となりの ひとへ パス（1P→2P→3P→4P→1P）
  ・いつ ばくはつ するかは ひみつ。ばくはつした とき もっていた ひとに ×。3かい やって × が すくない ひとの かち
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* PAD きょうつう: モニターは キャンバス 1まい、スマホは #pad の なか */
:root{--ink:#3a2328;--paper:#fffaf0;--ok:#2f9e5b;--blue:#4a9fe0;--me:#3a2328;--head:#3a2328}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;overflow:hidden}
canvas#cv{display:block;position:fixed;inset:0;width:100%;height:100%}
#pad{display:none;position:fixed;inset:0;overflow-y:auto;background:var(--paper);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.pad{background:var(--paper)}
body.pad #pad{display:block}
body.pad #cv{display:none}
#pad header{background:var(--head);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:5px solid var(--me)}
#pad header h1{margin:0;font-size:24px;letter-spacing:.06em}
#badge{margin-left:auto;font-size:15px;font-weight:bold;background:#7a6a60;padding:5px 12px;border-radius:99px;border:2px solid #fff}
#pad main{padding:16px;max-width:520px;margin:0 auto}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--ink)}
.card h2{margin:0 0 8px;font-size:19px}
ol.how{margin:0;padding:0;list-style:none;counter-reset:n}
ol.how li{counter-increment:n;display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:16px;line-height:1.45}
ol.how li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--me);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-weight:bold;font-size:14px}
.note{font-size:14px;line-height:1.5;background:#fff3c4;border:2px dashed #c9a227;border-radius:12px;padding:10px 12px;margin-bottom:14px}
button.big{display:block;width:100%;font:inherit;font-size:24px;font-weight:bold;letter-spacing:.08em;color:#fff;background:var(--ok);border:3px solid var(--ink);border-radius:18px;padding:16px 0;box-shadow:0 6px 0 var(--ink);margin:6px 0 16px}
button.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
button.big:disabled{background:#b9b1a8}
button.sub{font:inherit;font-size:16px;font-weight:bold;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 var(--ink)}
button.sub:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.seg{display:flex;gap:10px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-size:18px;font-weight:bold;padding:14px 4px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.seg button.on{background:var(--me);color:#fff}
.msg{font-size:21px;font-weight:bold;text-align:center;margin:2px 0 6px}
.small{font-size:14px;color:#7a6a60;text-align:center;line-height:1.5}
#conn{text-align:center;padding:40px 16px;font-size:20px;line-height:1.6}
[hidden]{display:none!important}
canvas#gl{display:block;position:fixed;inset:0;width:100%;height:100%}
body.pad #gl{display:none}

:root{--head:#3a3a3a}
#bombimg{display:block;margin:6px auto}
#throw{background:#e5484d;font-size:30px;padding:24px 0}
body.hold #pad{background:#ffe1cf}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="pad">
  <header><h1>ばくだん パス</h1><span id="badge">…</span></header>
  <main>
    <div id="conn">モニターに つないでいます…</div>
    <div id="app" hidden>
      <div class="card"><div class="msg" id="msg"></div><div class="small" id="sub"></div><canvas id="bombimg" width="200" height="170" hidden></canvas></div>
      <button class="big" id="ready">じゅんび OK！</button>
      <div id="hostbox" hidden><button class="big" id="start">スタート</button><button class="big" id="back" style="background:#7a6a60">ロビーへ</button></div>
      <button class="big" id="throw" hidden>なげる！</button>
      <div class="card">
        <h2>あそびかた</h2>
        <ol class="how">
          <li>みんなで まるく すわる（1P→2P→3P→4P の じゅん）</li>
          <li>ばくだんを もつと スマホが ブルブル！</li>
          <li>スマホを なげる ように ふると、となりの ひとへ パス（ボタンでも OK）</li>
          <li>ばくはつした とき もっていたら ×。3かいで × が すくない ひとの かち</li>
        </ol>
      </div>
      <div class="note">・ほんとうに スマホを なげないでね！ しっかり にぎって ふるだけ<br>・ストラップが あると あんしん</div>
    </div>
  </main>
</div>
<script>
/* =====================================================================
   PAD: モニター × スマホ の きょうつう ぶひん（スマホゲーム/<id>/src.html に build で うめこむ）
   ・PAD.isPad            ... ?room= が あれば スマホ（コントローラー）、なければ モニター
   ・PAD.host({...})      ... モニター: へやを つくる。さいだい max 人。1P〜4P の いろを わりあてる
   ・PAD.join({...})      ... スマホ: へやに はいる
   ・PAD.sensors          ... スマホ: かたむき・うごき（iPhone の きょかも ここ）
   ・PAD.sfx              ... こうかおん（ファイルなし。その場で つくる）
   ・PAD.draw(cx)         ... モニター: パネル・もじ・ほし・QR・ロビー画面
   つなぎかた: PeerJS（WebRTC）。モニターの ID は "<ゲームid>-<へやコード>"
   ===================================================================== */
const PAD = (() => {
  const Q = new URLSearchParams(location.search);
  const ROOM = (Q.get('room') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const COLORS = ['#e5484d', '#3d6bd6', '#f5c518', '#30a46c'];
  const COLOR_NAMES = ['あか', 'あお', 'きいろ', 'みどり'];
  const NAMES = ['1P', '2P', '3P', '4P'];
  const INK = '#3a2328', PAPER = '#fffaf0';
  const FONT = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';
  const online = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const rand = (n, abc = 'abcdefghjkmnpqrstuvwxyz23456789') => Array.from({ length: n }, () => abc[Math.random() * abc.length | 0]).join('');

  /* ---------- モニター: へやを つくる ---------- */
  function host({ id, max = 4, onJoin, onLeave, onData }) {
    const code = rand(5);
    const url = location.href.split(/[?#]/)[0] + '?room=' + code;
    const players = new Array(max).fill(null);  // slot → { pid, slot, color, cname, name, conn, token, online }
    let peer = null, status = 'じゅんびちゅう…', qr = null;
    try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q; } catch (e) {}
    const R = {
      code, url, players, max, qr, online,
      get status() { return status; },
      list() { return players.filter(p => p && p.online); },
      count() { return players.filter(p => p && p.online).length; },
      get(pid) { return players[pid - 1] || null; },
      send(pid, o) { const p = players[pid - 1]; if (p && p.online && p.conn.open) try { p.conn.send(o); } catch (e) {} },
      broadcast(o) { for (const p of players) if (p && p.online && p.conn.open) try { p.conn.send(o); } catch (e) {} },
    };
    if (typeof Peer === 'undefined') { status = 'インターネットに つながっていないよ'; return R; }
    peer = new Peer(id + '-' + code);
    peer.on('open', () => { status = ''; });
    peer.on('connection', c => {
      c.on('data', d => {
        if (!d || typeof d !== 'object') return;
        if (d.t === 'hello') {
          // おなじ スマホが つなぎなおしたら おなじ ばしょ。なければ あいている ばしょ → きれた ひとの ばしょ
          let slot = players.findIndex(p => p && p.token === d.token);
          if (slot < 0) slot = players.findIndex(p => !p);
          if (slot < 0) slot = players.findIndex(p => p && !p.online);
          if (slot < 0) { try { c.send({ t: 'full' }); } catch (e) {} setTimeout(() => c.close(), 400); return; }
          const back = !!(players[slot] && players[slot].token === d.token);
          if (back && players[slot].conn !== c) try { players[slot].conn.close(); } catch (e) {}
          const p = Object.assign(players[slot] && back ? players[slot] : {}, { pid: slot + 1, slot, color: COLORS[slot], cname: COLOR_NAMES[slot], name: NAMES[slot], conn: c, token: d.token, online: true });
          players[slot] = p; c._p = p;
          c.send({ t: 'welcome', pid: p.pid, color: p.color, cname: p.cname, name: p.name });
          sfx.join();
          onJoin && onJoin(p, back);
          return;
        }
        if (c._p && c._p.conn === c) onData && onData(c._p, d);
      });
      c.on('close', () => { const p = c._p; if (p && p.conn === c) { p.online = false; onLeave && onLeave(p); } });
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('error', e => { if (e.type !== 'peer-unavailable') status = 'つなぐ ところで エラー（' + (e.type || '') + '）'; });
    return R;
  }

  /* ---------- スマホ: へやに はいる ---------- */
  function join({ id, onWelcome, onData }) {
    let token = ''; try { token = sessionStorage.getItem('pad-token') || ''; } catch (e) {}
    if (!token) { token = rand(12); try { sessionStorage.setItem('pad-token', token); } catch (e) {} }
    let conn = null; const me = {};
    const $c = document.getElementById('conn'), $a = document.getElementById('app');
    function fail(html) {
      if ($a) $a.hidden = true; if (!$c) return; $c.hidden = false;
      $c.innerHTML = html + '<button class="big" onclick="location.reload()">もういちど つなぐ</button>';
    }
    const peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(id + '-' + ROOM, { reliable: true });
      const to = setTimeout(() => { if (!conn.open) fail('モニターが みつからないよ。<br>モニターの QRコードを もういちど よんでね'); }, 12000);
      conn.on('open', () => { clearTimeout(to); conn.send({ t: 'hello', token }); });
      conn.on('data', d => {
        if (!d || typeof d !== 'object') return;
        if (d.t === 'welcome') {
          Object.assign(me, d);
          if ($c) $c.hidden = true; if ($a) $a.hidden = false;
          const b = document.getElementById('badge'); if (b) { b.textContent = d.name + '（' + d.cname + '）'; b.style.background = d.color; b.style.color = d.color === '#f5c518' ? INK : '#fff'; }
          document.documentElement.style.setProperty('--me', d.color);
          onWelcome && onWelcome(d);
        } else if (d.t === 'full') fail('もう いっぱいだよ（' + NAMES.length + 'にんまで）');
        else if (d.t === 'vibe') { if (navigator.vibrate) navigator.vibrate(d.ms || 60); }
        else if (d.t === 'sfx') { if (typeof sfx[d.n] === 'function' && d.n !== 'unlock' && d.n !== 'ok') sfx[d.n](d.u); }
        else onData && onData(d);
      });
      conn.on('close', () => fail('きれちゃった。<br>モニターの QRコードを もういちど よんでね'));
    });
    peer.on('error', e => fail('つなげなかったよ（' + (e.type || 'error') + '）。<br>モニターの QRコードを もういちど よんでね'));
    // がめんが きえないように
    let lock = null;
    async function keepAwake() { try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {} }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
    return { me, send(o) { if (conn && conn.open) try { conn.send(o); } catch (e) {} }, keepAwake };
  }

  /* ---------- スマホ: センサー ---------- */
  const sensors = (() => {
    let asked = false, granted = false;
    const ori = { beta: 0, gamma: 0, alpha: 0, ok: false }, base = { beta: 0, gamma: 0, alpha: 0 };
    const subs = { motion: [], orient: [] };
    window.addEventListener('deviceorientation', e => {
      if (e.beta == null) return; ori.beta = e.beta; ori.gamma = e.gamma; ori.alpha = e.alpha || 0; ori.ok = true;
      for (const f of subs.orient) f(ori);
    });
    window.addEventListener('devicemotion', e => { for (const f of subs.motion) f(e); });
    const wrap = a => { while (a > 180) a -= 360; while (a < -180) a += 360; return a; };
    return {
      ori,
      // iPhone は ボタンを おした ときに きょかを もらう ひつようが ある
      async request() {
        if (asked) return granted; asked = true;
        try {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') { if (await DeviceMotionEvent.requestPermission() !== 'granted') return granted = false; }
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') { if (await DeviceOrientationEvent.requestPermission() !== 'granted') return granted = false; }
        } catch (e) { return granted = false; }
        return granted = true;
      },
      on(type, f) { subs[type].push(f); },
      // いまの むきを「まっすぐ」に する
      calibrate() { base.beta = ori.beta; base.gamma = ori.gamma; base.alpha = ori.alpha; },
      // かたむき（-1〜1）。range 度で いっぱい
      tilt(range = 25) {
        const c = v => Math.max(-1, Math.min(1, v));
        return { x: c(wrap(ori.gamma - base.gamma) / range), y: c(wrap(ori.beta - base.beta) / range) };
      },
      rel() { return { beta: wrap(ori.beta - base.beta), gamma: wrap(ori.gamma - base.gamma), alpha: wrap(ori.alpha - base.alpha) }; },
      // ふった「山」を みつける。f(つよさ m/s², いまの加速度ベクトル)
      onShake(f, { th = 13, gap = 170 } = {}) {
        let inPeak = 0, peak = 0, last = 0, vec = null; const g = [0, 0, 9.8];
        subs.motion.push(e => {
          let x, y, z; const a = e.acceleration;
          if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
          else { const q = e.accelerationIncludingGravity; if (!q || q.x == null) return; g[0] += (q.x - g[0]) * 0.1; g[1] += (q.y - g[1]) * 0.1; g[2] += (q.z - g[2]) * 0.1; x = q.x - g[0]; y = q.y - g[1]; z = q.z - g[2]; }
          const m = Math.hypot(x, y, z), now = performance.now();
          if (m > th) { if (!inPeak) { inPeak = now; peak = m; vec = [x, y, z]; } else if (m > peak) { peak = m; vec = [x, y, z]; } }
          if (inPeak && (m < th * 0.6 || now - inPeak > 350)) { inPeak = 0; if (now - last > gap) { last = now; f(Math.min(60, peak), vec); } }
        });
      },
    };
  })();

  /* ---------- こうかおん ---------- */
  const sfx = (() => {
    let ac = null, nb = null;
    function unlock() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (ac && ac.state === 'suspended') ac.resume(); }
    const ok = () => !!ac && ac.state === 'running';
    function noise({ dur = 0.2, f0 = 1000, f1 = f0, type = 'bandpass', q = 1, vol = 0.3, delay = 0 } = {}) {
      if (!ok()) return;
      if (!nb) { nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = nb; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.2)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function tone({ f0 = 660, f1 = f0, dur = 0.15, vol = 0.15, type = 'triangle', delay = 0 } = {}) {
      if (!ok()) return;
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    for (const ev of ['pointerdown', 'keydown', 'touchstart', 'mousedown', 'click']) addEventListener(ev, unlock, true);
    // モニターは ひらいた とたんに おとを ためす。ブラウザが ゆるしていれば（じどうさいせい OK の せってい）そのまま なる。
    // だめでも 1びょうごとに ためしつづける
    if (!ROOM) { unlock(); const iv = setInterval(() => { unlock(); if (ok()) clearInterval(iv); }, 1000); }
    return {
      unlock, ok, noise, tone,
      join() { tone({ f0: 660, dur: 0.12 }); tone({ f0: 990, dur: 0.22, delay: 0.1 }); },
      tap() { tone({ f0: 880, f1: 1200, dur: 0.06, vol: 0.1, type: 'sine' }); },
      count() { tone({ f0: 660, dur: 0.14, vol: 0.16, type: 'square' }); },
      go() { tone({ f0: 1047, dur: 0.4, vol: 0.16, type: 'square' }); tone({ f0: 1568, dur: 0.4, vol: 0.08 }); },
      tick() { tone({ f0: 1200, dur: 0.05, vol: 0.12, type: 'square' }); },
      good() { tone({ f0: 784, dur: 0.12, vol: 0.16 }); tone({ f0: 1175, dur: 0.25, vol: 0.16, delay: 0.09 }); },
      bad() { tone({ f0: 330, f1: 220, dur: 0.3, vol: 0.14, type: 'square' }); },
      fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone({ f0: f, dur: i === 3 ? 0.6 : 0.18, vol: 0.17, delay: i * 0.14 })); },
    };
  })();

  /* ---------- モニター: えがく どうぐ ---------- */
  function draw(cx) {
    const D = {
      INK, PAPER, FONT,
      rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); },
      panel(x, y, w, h, fill = PAPER, r = 18) { cx.fillStyle = INK; D.rr(x, y + 6, w, h, r); cx.fill(); cx.fillStyle = fill; D.rr(x, y, w, h, r); cx.fill(); cx.lineWidth = 4; cx.strokeStyle = INK; cx.stroke(); },
      text(t, x, y, size, color = INK, align = 'center', outline = null) {
        cx.font = `bold ${size}px ${FONT}`; cx.textAlign = align; cx.textBaseline = 'middle';
        if (outline) { cx.lineJoin = 'round'; cx.lineWidth = size * 0.22; cx.strokeStyle = outline; cx.strokeText(t, x, y); }
        cx.fillStyle = color; cx.fillText(t, x, y);
      },
      star(x, y, r, on = true) {
        cx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; cx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
        cx.closePath(); cx.fillStyle = on ? '#f5c518' : '#e6dccb'; cx.fill(); cx.lineWidth = Math.max(2, r * 0.12); cx.lineJoin = 'round'; cx.strokeStyle = INK; cx.stroke();
      },
      qr(room, x, y, size) {
        cx.fillStyle = INK; D.rr(x - 8, y - 8, size + 16, size + 16, 12); cx.fill();
        cx.fillStyle = '#fff'; cx.fillRect(x, y, size, size);
        const q = room.qr; if (!q) return; const n = q.getModuleCount(), m = 2, cell = size / (n + m * 2);
        cx.fillStyle = '#000';
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) cx.fillRect(Math.floor(x + (c + m) * cell), Math.floor(y + (r + m) * cell), Math.ceil(cell), Math.ceil(cell));
      },
      // ロビー: ひだりに QR、みぎに さんかしゃ
      lobby(room, W, H, { title, sub, hint, min = 1 }) {
        const pw = Math.min(W * 0.9, H * 1.5), ph = H * 0.84, x = (W - pw) / 2, y = H * 0.07;
        D.panel(x, y, pw, ph);
        D.text(title, x + pw / 2, y + ph * 0.09, ph * 0.08);
        if (sub) D.text(sub, x + pw / 2, y + ph * 0.17, ph * 0.034, '#7a6a60');
        const qs = Math.min(pw * 0.36, ph * 0.52), qx = x + pw * 0.06, qy = y + ph * 0.25;
        if (online) {
          D.qr(room, qx, qy, qs);
          D.text('スマホの カメラで よみとってね', qx + qs / 2, qy + qs + ph * 0.06, ph * 0.032);

  function seatOf(pid) { const l = alive(), i = l.findIndex(p => p.pid === pid); return seat(Math.max(0, i), l.length); }
  function bombPos() {
    if (G.fly) { const [x0, y0] = seatOf(G.fly.from), [x1, y1] = seatOf(G.fly.to), u = G.fly.t / 0.45; return [x0 + (x1 - x0) * u, y0 + (y1 - y0) * u - Math.sin(u * Math.PI) * S.H * 0.25 - S.H * 0.06]; }
    const [x, y] = seatOf(G.holder); return [x, y - S.H * 0.06];
  }
  function drawScene() {
    const W = S.W, Hh = S.H, l = alive();
    // せき
    l.forEach((p, i) => {
      const [x, y] = seat(i, l.length), r = Hh * 0.075, me = p.pid === G.holder;
      cx.fillStyle = 'rgba(0,0,0,.25)'; cx.beginPath(); cx.ellipse(x, y + r * 1.2, r * 1.3, r * 0.35, 0, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = p.color; cx.beginPath(); cx.arc(x, y + r * 0.2, r, Math.PI, 0); cx.lineTo(x + r, y + r * 1.2); cx.lineTo(x - r, y + r * 1.2); cx.closePath(); cx.fill(); cx.lineWidth = 4; cx.strokeStyle = INK; cx.stroke();
      cx.fillStyle = '#f6d3a8'; cx.beginPath(); cx.arc(x, y - r * 0.55, r * 0.6, 0, Math.PI * 2); cx.fill(); cx.stroke();
      cx.fillStyle = INK; const wob = me && G.phase === 'play' ? Math.sin(performance.now() / 60) * 2 : 0;
      cx.beginPath(); cx.arc(x - r * 0.2 + wob, y - r * 0.6, r * 0.07, 0, Math.PI * 2); cx.arc(x + r * 0.2 + wob, y - r * 0.6, r * 0.07, 0, Math.PI * 2); cx.fill();
      D.text(p.name, x, y + r * 1.75, Hh * 0.04, '#fff', 'center', INK);
      for (let k = 0; k < (G.x[p.pid] || 0); k++) D.text('×', x - r * 0.6 + k * r * 0.6, y - r * 1.55, Hh * 0.05, '#e5484d', 'center', '#fff');
    });
    // ばくだん
    if (G.phase === 'play' || G.pt < 0.15) {
      const [x, y] = bombPos(), k = Math.min(1, G.fuse / G.left), r = Hh * (0.06 + k * 0.025) * (1 + Math.sin(performance.now() / (120 - k * 80)) * 0.05 * (0.5 + k));
      cx.save(); cx.translate(x, y); if (!G.fly) cx.rotate(Math.sin(performance.now() / 50) * 0.08 * k);
      cx.fillStyle = k > 0.75 && (performance.now() / 100 | 0) % 2 ? '#7a2020' : '#2b2b2b'; cx.strokeStyle = '#000'; cx.lineWidth = 4;
      cx.beginPath(); cx.arc(0, 0, r, 0, Math.PI * 2); cx.fill(); cx.stroke();
      cx.fillStyle = '#777'; cx.fillRect(-r * 0.25, -r * 1.25, r * 0.5, r * 0.35); cx.strokeRect(-r * 0.25, -r * 1.25, r * 0.5, r * 0.35);
      cx.strokeStyle = '#c9a36a'; cx.beginPath(); cx.moveTo(0, -r * 1.25); cx.quadraticCurveTo(r * 0.6, -r * 1.7, r * 0.8, -r * 1.85); cx.stroke();
      cx.fillStyle = 'rgba(255,255,255,.55)'; cx.beginPath(); cx.arc(-r * 0.35, -r * 0.35, r * 0.18, 0, Math.PI * 2); cx.fill();
      cx.restore();
      for (const s of G.sparks) { cx.fillStyle = s.t < 0.2 ? '#fff6a0' : '#ff9a2e'; cx.beginPath(); cx.arc(s.x, s.y, 3, 0, Math.PI * 2); cx.fill(); }
    }
    if (G.phase === 'boom') {
      const [x, y] = seatOf(G.holder), u = Math.min(1, G.pt / 0.6);
      for (const [c, k] of [['#ff7a2e', 1], ['#ffd23f', 0.7], ['#fff6d0', 0.4]]) { cx.fillStyle = c; cx.globalAlpha = 1 - Math.max(0, G.pt - 1.5) / 1.5; cx.beginPath();
        for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, rr = Hh * 0.3 * k * u * (i % 2 ? 0.7 : 1); cx.lineTo(x + Math.cos(a) * rr, y - Hh * 0.06 + Math.sin(a) * rr); } cx.fill(); cx.globalAlpha = 1; }
      D.text('ドカーン！', W / 2, Hh * 0.18, Hh * 0.12, '#ffd23f', 'center', INK);
      D.text(name(G.holder) + 'に ×', W / 2, Hh * 0.3, Hh * 0.06, '#fff', 'center', INK);
    } else {
      D.text((G.round + 1) + 'かいめ / ' + ROUNDS, W / 2, Hh * 0.07, Hh * 0.05, '#fff', 'center', INK);
      D.text('いま もっているのは ' + name(G.holder), W / 2, Hh * 0.14, Hh * 0.04, '#ffd9a0', 'center', INK);
    }
  }
  window.__game = api; window.__end = () => { G.round = ROUNDS - 1; G.phase = 'boom'; G.pt = 9; };
}
