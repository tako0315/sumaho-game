<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>いきを あわせて ボート</title>
<!--
  いきを あわせて ボート（1〜4にん）
  ・1P と 2P で 1そう（1P＝ひだりの オール、2P＝みぎの オール）。3P と 4P で もう 1そう → レース
  ・スマホを オールの ように まえから うしろへ ぐいっと ふると こぐ
  ・ひだりだけ こぐと みぎへ、みぎだけ こぐと ひだりへ まがる。ふたり いっしょに こぐと「シンクロ！」で はやい
  ・モニターは 3D（three.js）。カメラが せんとうの ボートを おいかける
  ・スマホを よこに かたむけると かじ（すこし まがる）。ひとりの ときは ひだりも みぎも ひとりで こぐ
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* PAD きょうつう: モニターは キャンバス 1まい、スマホは #pad の なか */
:root{--ink:#3a2328;--paper:#fffaf0;--ok:#2f9e5b;--blue:#4a9fe0;--me:#3a2328;--head:#3a2328}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;overflow:hidden}
canvas#cv{display:block;position:fixed;inset:0;width:100%;height:100%}
#pad{display:none;position:fixed;inset:0;overflow-y:auto;background:var(--paper);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.pad{background:var(--paper)}
body.pad #pad{display:block}
body.pad #cv{display:none}
#pad header{background:var(--head);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:5px solid var(--me)}
#pad header h1{margin:0;font-size:24px;letter-spacing:.06em}
#badge{margin-left:auto;font-size:15px;font-weight:bold;background:#7a6a60;padding:5px 12px;border-radius:99px;border:2px solid #fff}
#pad main{padding:16px;max-width:520px;margin:0 auto}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--ink)}
.card h2{margin:0 0 8px;font-size:19px}
ol.how{margin:0;padding:0;list-style:none;counter-reset:n}
ol.how li{counter-increment:n;display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:16px;line-height:1.45}
ol.how li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--me);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-weight:bold;font-size:14px}
.note{font-size:14px;line-height:1.5;background:#fff3c4;border:2px dashed #c9a227;border-radius:12px;padding:10px 12px;margin-bottom:14px}
button.big{display:block;width:100%;font:inherit;font-size:24px;font-weight:bold;letter-spacing:.08em;color:#fff;background:var(--ok);border:3px solid var(--ink);border-radius:18px;padding:16px 0;box-shadow:0 6px 0 var(--ink);margin:6px 0 16px}
button.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
button.big:disabled{background:#b9b1a8}
button.sub{font:inherit;font-size:16px;font-weight:bold;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 var(--ink)}
button.sub:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.seg{display:flex;gap:10px;margin-bottom:12px}
.seg button{flex:1;font:inherit;font-size:18px;font-weight:bold;padding:14px 4px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.seg button.on{background:var(--me);color:#fff}
.msg{font-size:21px;font-weight:bold;text-align:center;margin:2px 0 6px}
.small{font-size:14px;color:#7a6a60;text-align:center;line-height:1.5}
#conn{text-align:center;padding:40px 16px;font-size:20px;line-height:1.6}
[hidden]{display:none!important}
canvas#gl{display:block;position:fixed;inset:0;width:100%;height:100%}
body.pad #gl{display:none}

:root{--head:#2a6f9e}
#side{font-size:32px;font-weight:bold;text-align:center;padding:10px;border:4px solid var(--ink);border-radius:16px;background:var(--me);color:#fff;margin:6px 0}
#row{background:#2a6f9e;font-size:30px;padding:26px 0}
#beat{display:flex;gap:10px;justify-content:center;margin:8px 0}
#beat i{width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);background:#fff;transition:background .1s}
#beat i.on{background:var(--me)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="pad">
  <header><h1>ボート</h1><span id="badge">…</span></header>
  <main>
    <div id="conn">モニターに つないでいます…</div>
    <div id="app" hidden>
      <div class="card"><div id="side" hidden></div><div class="msg" id="msg"></div><div class="small" id="sub"></div><div id="beat" hidden><i id="bl"></i><i id="br"></i></div></div>
      <button class="big" id="ready">じゅんび OK！</button>
      <div id="hostbox" hidden><button class="big" id="start">スタート</button><button class="big" id="back" style="background:#7a6a60">ロビーへ</button></div>
      <button class="big" id="row" hidden>こぐ！（センサーが ない とき）</button>
      <div class="card">
        <h2>あそびかた</h2>
        <ol class="how">
          <li>1P と 2P で 1そう、3P と 4P で もう 1そう</li>
          <li>スマホを オールの ように、まえから うしろへ ぐいっと ふって こぐ</li>
          <li>ひだりの オールだけだと みぎへ、みぎだけだと ひだりへ まがる</li>
          <li>ふたり いっしょに こぐと「シンクロ！」で ぐんと すすむ。「いち、に！」と こえを かけよう</li>
          <li>スマホを よこに かたむけると かじで すこし まがれる。いわに ぶつからずに ゴールへ</li>
        </ol>
      </div>
    </div>
  </main>
</div>
<script>
/* =====================================================================
   PAD: モニター × スマホ の きょうつう ぶひん（スマホゲーム/<id>/src.html に build で うめこむ）
   ・PAD.isPad            ... ?room= が あれば スマホ（コントローラー）、なければ モニター
   ・PAD.host({...})      ... モニター: へやを つくる。さいだい max 人。1P〜4P の いろを わりあてる
   ・PAD.join({...})      ... スマホ: へやに はいる
   ・PAD.sensors          ... スマホ: かたむき・うごき（iPhone の きょかも ここ）
   ・PAD.sfx              ... こうかおん（ファイルなし。その場で つくる）
   ・PAD.draw(cx)         ... モニター: パネル・もじ・ほし・QR・ロビー画面
   つなぎかた: PeerJS（WebRTC）。モニターの ID は "<ゲームid>-<へやコード>"
   ===================================================================== */
const PAD = (() => {
  const Q = new URLSearchParams(location.search);
  const ROOM = (Q.get('room') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const COLORS = ['#e5484d', '#3d6bd6', '#f5c518', '#30a46c'];
  const COLOR_NAMES = ['あか', 'あお', 'きいろ', 'みどり'];
  const NAMES = ['1P', '2P', '3P', '4P'];
  const INK = '#3a2328', PAPER = '#fffaf0';
  const FONT = '"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';
  const online = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const rand = (n, abc = 'abcdefghjkmnpqrstuvwxyz23456789') => Array.from({ length: n }, () => abc[Math.random() * abc.length | 0]).join('');

  /* ---------- モニター: へやを つくる ---------- */
  function host({ id, max = 4, onJoin, onLeave, onData }) {
    const code = rand(5);
    const url = location.href.split(/[?#]/)[0] + '?room=' + code;
    const players = new Array(max).fill(null);  // slot → { pid, slot, color, cname, name, conn, token, online }
    let peer = null, status = 'じゅんびちゅう…', qr = null;
    try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q; } catch (e) {}
    const R = {
      code, url, players, max, qr, online,
      get status() { return status; },
      list() { return players.filter(p => p && p.online); },
      count() { return players.filter(p => p && p.online).length; },
      get(pid) { return players[pid - 1] || null; },
      send(pid, o) { const p = players[pid - 1]; if (p && p.online && p.conn.open) try { p.conn.send(o); } catch (e) {} },
      broadcast(o) { for (const p of players) if (p && p.online && p.conn.open) try { p.conn.send(o); } catch (e) {} },
    };
    if (typeof Peer === 'undefined') { status = 'インターネットに つながっていないよ'; return R; }
    peer = new Peer(id + '-' + code);
    peer.on('open', () => { status = ''; });
    peer.on('connection', c => {
      c.on('data', d => {
        if (!d || typeof d !== 'object') return;
        if (d.t === 'hello') {
          // おなじ スマホが つなぎなおしたら おなじ ばしょ。なければ あいている ばしょ → きれた ひとの ばしょ
          let slot = players.findIndex(p => p && p.token === d.token);
          if (slot < 0) slot = players.findIndex(p => !p);
          if (slot < 0) slot = players.findIndex(p => p && !p.online);
          if (slot < 0) { try { c.send({ t: 'full' }); } catch (e) {} setTimeout(() => c.close(), 400); return; }
          const back = !!(players[slot] && players[slot].token === d.token);
          if (back && players[slot].conn !== c) try { players[slot].conn.close(); } catch (e) {}
          const p = Object.assign(players[slot] && back ? players[slot] : {}, { pid: slot + 1, slot, color: COLORS[slot], cname: COLOR_NAMES[slot], name: NAMES[slot], conn: c, token: d.token, online: true });
          players[slot] = p; c._p = p;
          c.send({ t: 'welcome', pid: p.pid, color: p.color, cname: p.cname, name: p.name });
          sfx.join();
          onJoin && onJoin(p, back);
          return;
        }
        if (c._p && c._p.conn === c) onData && onData(c._p, d);
      });
      c.on('close', () => { const p = c._p; if (p && p.conn === c) { p.online = false; onLeave && onLeave(p); } });
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('error', e => { if (e.type !== 'peer-unavailable') status = 'つなぐ ところで エラー（' + (e.type || '') + '）'; });
    return R;
  }

  /* ---------- スマホ: へやに はいる ---------- */
  function join({ id, onWelcome, onData }) {
    let token = ''; try { token = sessionStorage.getItem('pad-token') || ''; } catch (e) {}
    if (!token) { token = rand(12); try { sessionStorage.setItem('pad-token', token); } catch (e) {} }
    let conn = null; const me = {};
    const $c = document.getElementById('conn'), $a = document.getElementById('app');
    function fail(html) {
      if ($a) $a.hidden = true; if (!$c) return; $c.hidden = false;
      $c.innerHTML = html + '<button class="big" onclick="location.reload()">もういちど つなぐ</button>';
    }
    const peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(id + '-' + ROOM, { reliable: true });
      const to = setTimeout(() => { if (!conn.open) fail('モニターが みつからないよ。<br>モニターの QRコードを もういちど よんでね'); }, 12000);
      conn.on('open', () => { clearTimeout(to); conn.send({ t: 'hello', token }); });
      conn.on('data', d => {
        if (!d || typeof d !== 'object') return;
        if (d.t === 'welcome') {
          Object.assign(me, d);
          if ($c) $c.hidden = true; if ($a) $a.hidden = false;
          const b = document.getElementById('badge'); if (b) { b.textContent = d.name + '（' + d.cname + '）'; b.style.background = d.color; b.style.color = d.color === '#f5c518' ? INK : '#fff'; }
          document.documentElement.style.setProperty('--me', d.color);
          onWelcome && onWelcome(d);
        } else if (d.t === 'full') fail('もう いっぱいだよ（' + NAMES.length + 'にんまで）');
        else if (d.t === 'vibe') { if (navigator.vibrate) navigator.vibrate(d.ms || 60); }
        else if (d.t === 'sfx') { if (typeof sfx[d.n] === 'function' && d.n !== 'unlock' && d.n !== 'ok') sfx[d.n](d.u); }
        else onData && onData(d);
      });
      conn.on('close', () => fail('きれちゃった。<br>モニターの QRコードを もういちど よんでね'));
    });
    peer.on('error', e => fail('つなげなかったよ（' + (e.type || 'error') + '）。<br>モニターの QRコードを もういちど よんでね'));
    // がめんが きえないように
    let lock = null;
    async function keepAwake() { try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {} }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
    return { me, send(o) { if (conn && conn.open) try { conn.send(o); } catch (e) {} }, keepAwake };
  }

  /* ---------- スマホ: センサー ---------- */
  const sensors = (() => {
    let asked = false, granted = false;
    const ori = { beta: 0, gamma: 0, alpha: 0, ok: false }, base = { beta: 0, gamma: 0, alpha: 0 };
    const subs = { motion: [], orient: [] };
    window.addEventListener('deviceorientation', e => {
      if (e.beta == null) return; ori.beta = e.beta; ori.gamma = e.gamma; ori.alpha = e.alpha || 0; ori.ok = true;
      for (const f of subs.orient) f(ori);
    });
    window.addEventListener('devicemotion', e => { for (const f of subs.motion) f(e); });
    const wrap = a => { while (a > 180) a -= 360; while (a < -180) a += 360; return a; };
    return {
      ori,
      // iPhone は ボタンを おした ときに きょかを もらう ひつようが ある
      async request() {
        if (asked) return granted; asked = true;
        try {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') { if (await DeviceMotionEvent.requestPermission() !== 'granted') return granted = false; }
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') { if (await DeviceOrientationEvent.requestPermission() !== 'granted') return granted = false; }
        } catch (e) { return granted = false; }
        return granted = true;
      },
      on(type, f) { subs[type].push(f); },
      // いまの むきを「まっすぐ」に する
      calibrate() { base.beta = ori.beta; base.gamma = ori.gamma; base.alpha = ori.alpha; },
      // かたむき（-1〜1）。range 度で いっぱい
      tilt(range = 25) {
        const c = v => Math.max(-1, Math.min(1, v));
        return { x: c(wrap(ori.gamma - base.gamma) / range), y: c(wrap(ori.beta - base.beta) / range) };
      },
      rel() { return { beta: wrap(ori.beta - base.beta), gamma: wrap(ori.gamma - base.gamma), alpha: wrap(ori.alpha - base.alpha) }; },
      // ふった「山」を みつける。f(つよさ m/s², いまの加速度ベクトル)
      onShake(f, { th = 13, gap = 170 } = {}) {
        let inPeak = 0, peak = 0, last = 0, vec = null; const g = [0, 0, 9.8];
        subs.motion.push(e => {
          let x, y, z; const a = e.acceleration;
          if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
          else { const q = e.accelerationIncludingGravity; if (!q || q.x == null) return; g[0] += (q.x - g[0]) * 0.1; g[1] += (q.y - g[1]) * 0.1; g[2] += (q.z - g[2]) * 0.1; x = q.x - g[0]; y = q.y - g[1]; z = q.z - g[2]; }
          const m = Math.hypot(x, y, z), now = performance.now();
          if (m > th) { if (!inPeak) { inPeak = now; peak = m; vec = [x, y, z]; } else if (m > peak) { peak = m; vec = [x, y, z]; } }
          if (inPeak && (m < th * 0.6 || now - inPeak > 350)) { inPeak = 0; if (now - last > gap) { last = now; f(Math.min(60, peak), vec); } }
        });
      },
    };
  })();

  /* ---------- こうかおん ---------- */
  const sfx = (() => {
    let ac = null, nb = null;
    function unlock() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (ac && ac.state === 'suspended') ac.resume(); }
    const ok = () => !!ac && ac.state === 'running';
    function noise({ dur = 0.2, f0 = 1000, f1 = f0, type = 'bandpass', q = 1, vol = 0.3, delay = 0 } = {}) {
      if (!ok()) return;
      if (!nb) { nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = nb; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.2)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function tone({ f0 = 660, f1 = f0, dur = 0.15, vol = 0.15, type = 'triangle', delay = 0 } = {}) {
      if (!ok()) return;
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    for (const ev of ['pointerdown', 'keydown', 'touchstart', 'mousedown', 'click']) addEventListener(ev, unlock, true);
    // モニターは ひらいた とたんに おとを ためす。ブラウザが ゆるしていれば（じどうさいせい OK の せってい）そのまま なる。
    // だめでも 1びょうごとに ためしつづける
    if (!ROOM) { unlock(); const iv = setInterval(() => { unlock(); if (ok()) clearInterval(iv); }, 1000); }
    return {
      unlock, ok, noise, tone,
      join() { tone({ f0: 660, dur: 0.12 }); tone({ f0: 990, dur: 0.22, delay: 0.1 }); },
      tap() { tone({ f0: 880, f1: 1200, dur: 0.06, vol: 0.1, type: 'sine' }); },
      count() { tone({ f0: 660, dur: 0.14, vol: 0.16, type: 'square' }); },
      go() { tone({ f0: 1047, dur: 0.4, vol: 0.16, type: 'square' }); tone({ f0: 1568, dur: 0.4, vol: 0.08 }); },
      tick() { tone({ f0: 1200, dur: 0.05, vol: 0.12, type: 'square' }); },
      good() { tone({ f0: 784, dur: 0.12, vol: 0.16 }); tone({ f0: 1175, dur: 0.25, vol: 0.16, delay: 0.09 }); },
      bad() { tone({ f0: 330, f1: 220, dur: 0.3, vol: 0.14, type: 'square' }); },
      fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone({ f0: f, dur: i === 3 ? 0.6 : 0.18, vol: 0.17, delay: i * 0.14 })); },
    };
  })();

  /* ---------- モニター: えがく どうぐ ---------- */
  function draw(cx) {
    const D = {
      INK, PAPER, FONT,
      rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); },
      panel(x, y, w, h, fill = PAPER, r = 18) { cx.fillStyle = INK; D.rr(x, y + 6, w, h, r); cx.fill(); cx.fillStyle = fill; D.rr(x, y, w, h, r); cx.fill(); cx.lineWidth = 4; cx.strokeStyle = INK; cx.stroke(); },
      text(t, x, y, size, color = INK, align = 'center', outline = null) {
        cx.font = `bold ${size}px ${FONT}`; cx.textAlign = align; cx.textBaseline = 'middle';
        if (outline) { cx.lineJoin = 'round'; cx.lineWidth = size * 0.22; cx.strokeStyle = outline; cx.strokeText(t, x, y); }
        cx.fillStyle = color; cx.fillText(t, x, y);
      },
      star(x, y, r, on = true) {
        cx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; cx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
        cx.closePath(); cx.fillStyle = on ? '#f5c518' : '#e6dccb'; cx.fill(); cx.lineWidth = Math.max(2, r * 0.12); cx.lineJoin = 'round'; cx.strokeStyle = INK; cx.stroke();
      },
      qr(room, x, y, size) {
        cx.fillStyle = INK; D.rr(x - 8, y - 8, size + 16, size + 16, 12); cx.fill();
        cx.fillStyle = '#fff'; cx.fillRect(x, y, size, size);
        const q = room.qr; if (!q) return; const n = q.getModuleCount(), m = 2, cell = size / (n + m * 2);
        cx.fillStyle = '#000';
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) cx.fillRect(Math.floor(x + (c + m) * cell), Math.floor(y + (r + m) * cell), Math.ceil(cell), Math.ceil(cell));
      },
      // ロビー: ひだりに QR、みぎに さんかしゃ
      lobby(room, W, H, { title, sub, hint, min = 1 }) {
        const pw = Math.min(W * 0.9, H * 1.5), ph = H * 0.84, x = (W - pw) / 2, y = H * 0.07;
        D.panel(x, y, pw, ph);
        D.text(title, x + pw / 2, y + ph * 0.09, ph * 0.08);
        if (sub) D.text(sub, x + pw / 2, y + ph * 0.17, ph * 0.034, '#7a6a60');
        const qs = Math.min(pw * 0.36, ph * 0.52), qx = x + pw * 0.06, qy = y + ph * 0.25;
        if (online) {
          D.qr(room, qx, qy, qs);
          D.text('スマホの カメラで よみとってね', qx + qs / 2, qy + qs + ph * 0.06, ph * 0.032);
          D.text(room.status || ('へやの ばんごう ' + room.code.toUpperCase()), qx + qs / 2, qy + qs + ph * 0.11, ph * 0.026, room.status ? '#d63a32' : '#7a6a60');
        } else {
          cx.fillStyle = '#f3e8d6'; D.rr(qx, qy, qs, qs, 12); cx.fill();
          D.text('QRコードは https で', qx + qs / 2, qy + qs * 0.42, ph * 0.03); D.text('ひらくと でます', qx + qs / 2, qy + qs * 0.52, ph * 0.03);
        }
        const lx = x + pw * 0.5, lw = pw * 0.44, sh = ph * 0.12;
        D.text('さんか する ひと', lx + lw / 2, qy + ph * 0.01, ph * 0.034);
        for (let i = 0; i < room.max; i++) {
          const p = room.players[i], yy = qy + ph * 0.06 + i * (sh + ph * 0.025), on = p && p.online;
          cx.fillStyle = on ? COLORS[i] : '#eee4d4'; D.rr(lx, yy, lw, sh, 14); cx.fill(); cx.lineWidth = 3; cx.strokeStyle = INK; cx.stroke();
          D.text(NAMES[i], lx + sh * 0.6, yy + sh / 2, sh * 0.42, on ? (i === 2 ? INK : '#fff') : '#b5a898');
          D.text(on ? (p.ready ? 'じゅんび OK！' : 'さんか ちゅう') :(p ? 'きれた…' : 'まっています'), lx + lw * 0.58, yy + sh / 2, sh * 0.32, on ? (i === 2 ? INK : '#fff') : '#b5a898');
        }
        if (hint) D.text(hint, x + pw / 2, y + ph * 0.94, ph * 0.034, room.count() >= min ? '#2f9e5b' : '#7a6a60');
      },
      // まんなかの けっか パネル。rows: [{ color, a, b, hi }]
      result(W, H, title, rows, foot, u = 1) {
        const pw = Math.min(W * 0.62, H * 1.15), ph = H * (0.3 + rows.length * 0.085), x = (W - pw) / 2, y = (H - ph) / 2;
        cx.save(); cx.translate(W / 2, H / 2); cx.scale(0.85 + 0.15 * u, 0.85 + 0.15 * u); cx.translate(-W / 2, -H / 2);
        D.panel(x, y, pw, ph);

          const yy = y + H * 0.17 + i * H * 0.085;

          D.text(r.a, x + pw * 0.23, yy, H * 0.044, INK, 'left'); D.text(r.b || '', x + pw * 0.88, yy, H * 0.044, r.hi ? '#d63a32' : INK, 'right');

      },
      // けっかの タイトル（1いが ふたり いじょう なら ひきわけ）
      winTitle(r) { const top = r.filter(x => x.place === 1); return top.length > 1 ? 'ひきわけ！' : 'ゆうしょうは ' + top[0].name + '！'; },
      // じゅんいを つける（おなじ てんは おなじ じゅんい）
      rank(list, key = 'pts', desc = true) {
        const a = list.slice().sort((p, q) => desc ? q[key] - p[key] : p[key] - q[key]);

  }

  // モニターの キャンバス（DPR たいおう）
  function canvas(el, onResize) {
    const cx = el.getContext('2d'); const S = { W: 0, H: 0 };
    function fit() { const d = Math.min(2, devicePixelRatio || 1); S.W = innerWidth; S.H = innerHeight; el.width = Math.round(S.W * d); el.height = Math.round(S.H * d); cx.setTransform(d, 0, 0, d, 0, 0); if (onResize && ready) onResize(S.W, S.H); }

    let ready = false; addEventListener('resize', fit); fit(); ready = true; return { cx, S };
  }

  /* ---------- モニター: 3D（three.js）。#gl キャンバスに かく。2D の #cv は うえに かさねて もじ・パネル用 ----------
     たいらな いろ（トゥーン）＋ こい ふちどり で、ほかの ゲームの えと そろえる */
  function gl(opt = {}) {
    const el = document.getElementById('gl');
    const renderer = new THREE.WebGLRenderer({ canvas: el, antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    if (opt.shadow) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
    const scene = new THREE.Scene(); scene.background = new THREE.Color(opt.bg || '#efe3cc');
    const camera = new THREE.PerspectiveCamera(opt.fov || 45, 1, 0.1, 500);
    const grad = new THREE.DataTexture(new Uint8Array([150, 150, 150, 255, 255, 255, 255, 255]), 2, 1, THREE.RGBAFormat);  // 2だんかいの かげ
    grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
    const mats = {};
    const toon = c => mats[c] || (mats[c] = new THREE.MeshToonMaterial({ color: c, gradientMap: grad }));
    const inkMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
    // ふちどり: うらがえしの すこし おおきい くろい かたち
    function outline(mesh, w = 0.05) { const o = new THREE.Mesh(mesh.geometry, inkMat); o.scale.setScalar(1 + w); mesh.add(o); return mesh; }
    function mesh(geo, color, { ink = 0.05, cast = true, recv = false } = {}) { const m = new THREE.Mesh(geo, toon(color)); m.castShadow = cast; m.receiveShadow = recv; if (ink) outline(m, ink); return m; }
    scene.add(new THREE.AmbientLight(0xffffff, 0.48));
    const sun = new THREE.DirectionalLight(0xffffff, 0.62); sun.position.set(4, 10, 6); scene.add(sun); scene.add(sun.target);
    if (opt.shadow) { sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); const c = sun.shadow.camera; c.left = c.bottom = -20; c.right = c.top = 20; c.near = 0.5; c.far = 60; }

    const v = new THREE.Vector3();
    function toScreen(x, y, z) { v.set(x, y, z).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight, v.z < 1]; }
    return { THREE, renderer, scene, camera, sun, toon, outline, mesh, inkMat, toScreen, render: () => renderer.render(scene, camera) };
  }

  /* ---------- モニター: ゲームの ながれ（ロビー → 3・2・1 → プレイ → けっか） ----------
     spec: { id, title, sub, min, max, bg, init(members), update(dt), draw(), onData(p, d), stateFor(p), onKey(e), resize(W, H) }
     api.finish(title, rows) で けっか。rows: [{ color, a, b, hi }] */
  function game(spec) {
    const api = { st: 'lobby', t: 0, members: [], final: null };
    const { cx, S } = canvas(document.getElementById('cv'), (W, H) => spec.resize && spec.resize(W, H));
    const D = draw(cx); Object.assign(api, { cx, D, S });
    const min = spec.min || 1;
    const room = host({
      id: spec.id, max: spec.max || 4,
      onJoin: p => { spec.onJoin && spec.onJoin(p); push(); },
      onLeave: p => { spec.onLeave && spec.onLeave(p); push(); },
      onData: (p, d) => {
        if (d.t === 'ready') { p.ready = true; push(); return; }
        if (d.t === 'start') { if (isHost(p) && (api.st === 'lobby' || api.st === 'final')) begin(); return; }
        if (d.t === 'lobby') { if (isHost(p) && api.st === 'final') { api.st = 'lobby'; push(); } return; }
        if (api.st === 'play' || spec.dataAlways) spec.onData && spec.onData(p, d);
      },
    });
    api.room = room;
    const isHost = p => { const l = room.list(); return !!l.length && l[0].pid === p.pid; };
    function begin() {
      const l = room.list();
      if (l.length < min) { if (min > 1 || !spec.keyboard) { sfx.bad(); return; } }
      api.members = l.length ? l : [{ pid: 1, color: COLORS[0], cname: COLOR_NAMES[0], name: NAMES[0], kb: true, online: true }];
      api.final = null; api.t = 0; api.st = 'count';
      spec.init(api.members); room.broadcast({ t: 'calib' }); push();
    }
    api.begin = begin;
    api.finish = (title, rows) => { api.st = 'final'; api.t = 0; api.final = { title, rows }; sfx.fanfare(); room.broadcast({ t: 'vibe', ms: 200 }); push(); };
    let lastPush = 0;
    function push(force = true) {
      const now = performance.now(); if (!force && now - lastPush < 300) return; lastPush = now;
      for (const p of room.list()) { let x = {}; try { x = spec.stateFor ? spec.stateFor(p) || {} : {}; } catch (e) { console.error(e); } room.send(p.pid, Object.assign({ t: 'state', st: api.st, host: isHost(p) }, x)); }
    }
    api.push = push;
    api.isHost = isHost;
    api.alive = p => p.kb || p.online;
    addEventListener('keydown', e => {
      if (e.code === 'Enter' && (api.st === 'lobby' || api.st === 'final')) begin();
      else if (api.st === 'final' && e.code === 'Escape') { api.st = 'lobby'; push(); }
      else if (api.st === 'play' && spec.onKey) spec.onKey(e, true);
    });
    addEventListener('keyup', e => { if (api.st === 'play' && spec.onKey) spec.onKey(e, false); });
    loop(dt => {
      api.t += dt; const W = S.W, H = S.H;
      if (api.st === 'count') {
        const n = Math.ceil(3 - api.t), pr = Math.ceil(3 - (api.t - dt)); if (n !== pr && n > 0) sfx.count();
        if (api.t >= 3) { api.st = 'play'; api.t = 0; sfx.go(); spec.onPlay && spec.onPlay(); push(); }
      } else if (api.st === 'play') { spec.update(dt); push(false); }
      cx.clearRect(0, 0, W, H);
      if (spec.bg) spec.bg(W, H); else { cx.fillStyle = '#efe3cc'; cx.fillRect(0, 0, W, H); }
      if (api.st === 'lobby') {
        const n = room.count();
        D.lobby(room, W, H, { title: spec.title, sub: spec.sub, min,
          hint: n >= min ? '1P の スマホで スタート（Enter でも はじまる）' : (min > 1 ? 'あと ' + (min - n) + 'にん さんか すると はじめられるよ' : 'スマホが なくても Enter で ためせるよ') });
      } else {
        spec.draw(dt);
        if (api.st === 'count') { const n = Math.ceil(3 - api.t); D.text(String(n), W / 2, H / 2, H * (0.3 - (api.t % 1) * 0.08), '#fff', 'center', INK); if (spec.countMsg) D.text(spec.countMsg, W / 2, H * 0.72, H * 0.05, '#fff', 'center', INK); }
        if (api.st === 'play' && api.t < 1) D.text('スタート！', W / 2, H / 2, H * 0.12, '#fff', 'center', INK);
        if (api.st === 'final' && api.final) D.result(W, H, api.final.title, api.final.rows, '1P の スマホで「もういちど」（Enter でも OK）', Math.min(1, api.t / 0.3));
      }
      D.soundHint(W, H);
    });
    return api;
  }

  /* ---------- スマホ: ゲームの ながれ ----------
     HTML に #msg #sub #ready #hostbox（#start #back）が あれば ここで うごかす */
  function phone({ id, onState, onData, onReady, msgs = {} }) {
    document.body.classList.add('pad');
    const $ = i => document.getElementById(i);
    const P = { st: {}, ready: false };
    const net = join({ id, onWelcome: () => render(), onData: d => {
      if (d.t === 'state') { P.st = d; render(); onState && onState(d); }
      else if (d.t === 'calib') sensors.calibrate();
      else onData && onData(d);
    } });
    function render() {
      const st = P.st, s = st.st || 'lobby';
      if ($('ready')) $('ready').hidden = P.ready;
      if ($('hostbox')) $('hostbox').hidden = !(P.ready && st.host && (s === 'lobby' || s === 'final'));
      if ($('start')) $('start').textContent = s === 'final' ? 'もういちど' : 'スタート';
      if ($('back')) $('back').hidden = s !== 'final';
      let msg = 'つながったよ！', sub = '';
      if (!P.ready) sub = '「じゅんび OK！」を おしてね';
      else if (s === 'lobby') { msg = st.host ? 'みんな そろったら スタート' : '1P が スタートするのを まってね'; sub = msgs.lobby || ''; }
      else if (s === 'count') { msg = msgs.count || 'じゅんび…'; }
      else if (s === 'final') { msg = st.msg || 'おしまい！'; sub = st.host ? 'もういちど あそぶ？' : 'モニターを みてね'; }
      if (s === 'play' || st.msg) { msg = st.msg || msg; sub = st.sub || sub; }
      if ($('msg')) $('msg').textContent = msg; if ($('sub')) $('sub').textContent = sub;
    }
    if ($('ready')) $('ready').onclick = async () => {
      sfx.unlock(); sfx.tap(); await sensors.request(); sensors.calibrate(); net.keepAwake();
      P.ready = true; net.send({ t: 'ready' }); render(); onReady && onReady();
    };
    if ($('start')) $('start').onclick = () => { sfx.tap(); net.send({ t: 'start' }); };
    if ($('back')) $('back').onclick = () => { sfx.tap(); net.send({ t: 'lobby' }); };
    return Object.assign(P, { net, send: o => net.send(o), render, me: net.me });
  }

  return { isPad: !!ROOM, ROOM, COLORS, COLOR_NAMES, NAMES, INK, PAPER, FONT, online, host, join, sensors, sfx, draw, canvas, loop, game, phone, gl };
})();

</script>
<script>
'use strict';
const GAME_ID = 'boat', LEN = 9000;
if (PAD.isPad) startPad(); else startMonitor();

function startPad() {
  const $ = id => document.getElementById(id), S = PAD.sensors;
  let lastMot = 0, lastOri = 0;
  const P = PAD.phone({ id: GAME_ID, msgs: { count: 'オールを かまえて！' }, onState: d => {
    const on = d.st === 'play' || d.st === 'count';
    $('side').hidden = !on || !d.side; $('beat').hidden = !on; $('row').hidden = !on || performance.now() - lastMot < 1500;
    if (d.side) $('side').textContent = { L: 'ひだりの オール', R: 'みぎの オール', LR: 'りょうほうの オール' }[d.side];
  }, onData: d => { if (d.t === 'beat') { const el = $(d.s === 'L' ? 'bl' : 'br'); el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 250); } } });
  S.on('motion', () => { lastMot = performance.now(); });
  S.on('orient', () => { lastOri = performance.now(); });
  const stroke = p => { P.send({ t: 'row', p }); PAD.sfx.noise({ dur: 0.25, f0: 900, f1: 300, type: 'lowpass', vol: 0.15 }); if (navigator.vibrate) navigator.vibrate(30); };
  S.onShake(stroke, { th: 13, gap: 350 });
  $('row').addEventListener('pointerdown', e => { e.preventDefault(); stroke(22); });
  setInterval(() => { const t = performance.now() - lastOri < 1000 ? S.tilt(30).x : 0; P.send({ t: 'rud', x: +t.toFixed(2) }); }, 100);
}

function startMonitor() {
  let G = {}; const rud = {};
  const api = PAD.game({
    id: GAME_ID, title: 'いきを あわせて ボート', sub: 'ふたりで オールを こいで ゴールへ！（1〜4にん）', keyboard: true, countMsg: 'オールを かまえて！',
    init(members) {
      // 1P・2P → ボートA、3P・4P → ボートB
      const crews = [members.filter(p => p.pid <= 2), members.filter(p => p.pid >= 3)].filter(c => c.length);
      const rocks = []; for (let y = 900; y < LEN - 400; y += 380 + Math.random() * 300) rocks.push({ y, x: (Math.random() - 0.5) * 0.7, r: 40 + Math.random() * 35 });
      G = { rocks, pops: [], ripples: [], rank: 0, endT: -1,
        boats: crews.map((c, i) => ({ crew: c, color: c[0].color, color2: (c[1] || c[0]).color, x: crews.length > 1 ? (i ? 0.22 : -0.22) : 0, y: 0, a: 0, v: 0, va: 0, last: { L: -9, R: -9 }, oar: { L: 0, R: 0 }, hit: 0, done: false, place: 0, time: 0, sync: 0 })) };
      for (const p of members) rud[p.pid] = 0;
    },
    onData(p, d) {
      const b = boatOf(p.pid); if (!b) return;
      if (d.t === 'rud') rud[p.pid] = Math.max(-1, Math.min(1, +d.x || 0));
      else if (d.t === 'row') { const s = sideOf(p.pid); if (s === 'LR') { row(b, 'L', +d.p); row(b, 'R', +d.p); } else row(b, s, +d.p); }
    },
    stateFor(p) {
      const b = G.boats && boatOf(p.pid); if (!b) return {};
      if (api.st === 'final') return { msg: b.place ? (G.boats.length > 1 ? (b.place === 1 ? 'かち！' : 'まけ…') : 'ゴール！') + ' ' + b.time.toFixed(1) + 'びょう' : 'ゴールできず' };
      return { side: sideOf(p.pid), msg: b.done ? 'ゴール！' : 'こげ！こげ！', sub: 'のこり ' + Math.max(0, Math.round((LEN - b.y) / 100)) + 'm' };
    },
    update(dt) {
      const W = S.W;
      for (const b of G.boats) {
        if (b.done) continue;
        b.hit -= dt; b.sync -= dt; b.oar.L = Math.max(0, b.oar.L - dt * 3); b.oar.R = Math.max(0, b.oar.R - dt * 3);
        const rd = b.crew.reduce((s, p) => s + (rud[p.pid] || 0), 0) / b.crew.length;
        b.va += rd * 1.2 * dt;
        b.va *= Math.exp(-2.5 * dt); b.a += b.va * dt; b.a *= Math.exp(-0.3 * dt);
        b.v *= Math.exp(-0.55 * dt);
        b.y += Math.cos(b.a) * b.v * dt; b.x += Math.sin(b.a) * b.v * dt / 1400;
        // きし
        const half = riverHalf(b.y);
        if (Math.abs(b.x) > half - 0.06) { b.x = Math.sign(b.x) * (half - 0.06); b.v *= 0.5; b.a *= 0.5; if (b.hit <= 0) { b.hit = 0.4; bump(b); } }
        // いわ
        for (const r of G.rocks) { const dy = b.y - r.y, dx = (b.x - r.x) * 1000; if (Math.hypot(dx, dy) < r.r + 40) { b.y = r.y + Math.sign(dy || -1) * (r.r + 41) * Math.abs(dy) / (Math.hypot(dx, dy) || 1); b.v *= 0.3; b.va += (dx > 0 ? 1 : -1) * 0.8; if (b.hit <= 0) { b.hit = 0.6; bump(b); } } }
        if (b.y >= LEN) { b.done = true; b.place = ++G.rank; b.time = api.t; PAD.sfx.fanfare(); for (const p of b.crew) api.room.send(p.pid, { t: 'vibe', ms: 300 }); if (G.endT < 0) G.endT = 0; api.push(); }
        if (Math.random() < b.v / 400 * dt * 10) G.ripples.push({ x: b.x, y: b.y - 60, t: 0 });
      }
      for (const q of G.pops) q.t += dt; G.pops = G.pops.filter(q => q.t < 0.9);
      for (const q of G.ripples) q.t += dt; G.ripples = G.ripples.filter(q => q.t < 1.2);
      if (G.endT >= 0) G.endT += dt;
      if (G.boats.every(b => b.done) || G.endT > 15) {
        const rows = G.boats.slice().sort((a, b) => (a.place || 9) - (b.place || 9) || b.y - a.y);
        api.finish(G.boats.length > 1 ? (rows[0].place ? rows[0].crew.map(p => p.name).join('・') + 'の かち！' : 'じかんぎれ') : (rows[0].place ? 'ゴール！' : 'じかんぎれ'),
          rows.map(b => ({ color: b.color, a: (b.place ? b.place + 'い  ' : '−  ') + b.crew.map(p => p.name).join('・'), b: b.place ? b.time.toFixed(1) + 'びょう' : Math.round((LEN - b.y) / 100) + 'm のこり', hi: b.place === 1 })));
      }
    },
    draw() { drawScene(); },
    bg(W, H) { if (api.st === 'lobby') { if (built !== G && G.boats) build3D(); V.camera.position.set(Math.sin(api.t * 0.2) * 4, 9, 6); V.camera.lookAt(0, 0, -8); V.render(); } },  // 3D は #gl に かく
    onKey(e, down) { if (!down || !G.boats || !api.members[0].kb) return; const b = G.boats[0]; if (e.code === 'KeyA' || e.code === 'ArrowLeft') row(b, 'L', 22); if (e.code === 'KeyD' || e.code === 'ArrowRight') row(b, 'R', 22); if (e.code === 'Space') { row(b, 'L', 22); row(b, 'R', 22); } },
  });
  const cx = api.cx, D = api.D, S = api.S, INK = PAD.INK;
  const boatOf = pid => G.boats.find(b => b.crew.some(p => p.pid === pid));
  function sideOf(pid) { const b = boatOf(pid); if (!b) return ''; if (b.crew.length === 1) return 'LR'; return b.crew[0].pid === pid ? 'L' : 'R'; }
  const riverHalf = y => 0.42 + Math.sin(y / 1300) * 0.08 + Math.sin(y / 470) * 0.03;
  function bump(b) { PAD.sfx.tone({ f0: 200, f1: 90, dur: 0.25, vol: 0.2, type: 'square' }); PAD.sfx.noise({ dur: 0.2, f0: 500, f1: 200, type: 'lowpass', vol: 0.3 }); for (const p of b.crew) api.room.send(p.pid, { t: 'vibe', ms: 150 }); G.pops.push({ b, txt: 'ゴツン！', t: 0 }); }
  function row(b, side, p) {
    if (api.st !== 'play' || b.done) return;
    const now = api.t, pow = 70 + Math.max(0, Math.min(1, (p - 12) / 25)) * 90, other = side === 'L' ? 'R' : 'L';
    let boost = 1;
    if (now - b.last[other] < 0.35 && b.crew.length > 1) { boost = 1.7; b.sync = 0.6; G.pops.push({ b, txt: 'シンクロ！', t: 0, good: true }); PAD.sfx.good(); }
    b.last[side] = now; b.oar[side] = 1;
    b.v = Math.min(900, b.v + pow * boost);
    b.va += (side === 'L' ? 1 : -1) * (boost > 1 ? 0.05 : 0.45);  // かたほうだけ こぐと まがる
    PAD.sfx.noise({ dur: 0.3, f0: 700, f1: 250, type: 'lowpass', vol: 0.25 });
    for (const q of b.crew) api.room.send(q.pid, { t: 'beat', s: side });
  }
  // ---- 3D ----
  // せかい: よこ X = b.x * 14、まえ Z = −b.y / 100（まえへ すすむほど Z が マイナス）
  const V = PAD.gl({ bg: '#bfe6f5', shadow: false, fov: 50 }), T3 = THREE;
  const world = new T3.Group(); V.scene.add(world);
  const ground = V.mesh(new T3.PlaneGeometry(400, 400), '#7cc46a', { ink: 0, cast: false }); ground.rotation.x = -Math.PI / 2; ground.position.set(0, -0.02, -40); V.scene.add(ground);
  const toX = x => x * 14, toZ = y => -y / 100;
  let built = null, boatG = new Map(), ripples = [];
  function checkerTex() { const c = document.createElement('canvas'); c.width = 256; c.height = 64; const g = c.getContext('2d'); for (let i = 0; i < 16; i++) for (let j = 0; j < 4; j++) { g.fillStyle = (i + j) % 2 ? '#ffffff' : '#3a2328'; g.fillRect(i * 16, j * 16, 16, 16); } const t = new T3.CanvasTexture(c); return t; }
  function build3D() {
    while (world.children.length) world.remove(world.children[0]);
    boatG.clear(); ripples = []; built = G;
    // かわ（きしに そった リボン）
    const N = Math.ceil(LEN / 100) + 30, pos = [], idx = [];
    for (let i = 0; i <= N; i++) { const y = (i - 10) * 100, h = riverHalf(y) * 14; pos.push(-h, 0, toZ(y), h, 0, toZ(y)); if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } }
    const rg = new T3.BufferGeometry(); rg.setAttribute('position', new T3.Float32BufferAttribute(pos, 3)); rg.setIndex(idx); rg.computeVertexNormals();
    world.add(new T3.Mesh(rg, V.toon('#4aa3d8')));
    for (const side of [-1, 1]) { const pts = []; for (let i = 0; i <= N; i++) { const y = (i - 10) * 100; pts.push(new T3.Vector3(side * riverHalf(y) * 14, 0.03, toZ(y))); } world.add(new T3.Line(new T3.BufferGeometry().setFromPoints(pts), new T3.LineBasicMaterial({ color: '#2d6f45' }))); }
    // き（インスタンス）
    const nT = 220, cone = new T3.InstancedMesh(new T3.ConeGeometry(0.9, 2.2, 7), V.toon('#3f8f4a'), nT), trunk = new T3.InstancedMesh(new T3.CylinderGeometry(0.18, 0.22, 0.8, 6), V.toon('#7a4a2a'), nT);
    const M4 = new T3.Matrix4();
    for (let i = 0; i < nT; i++) { const y = (i / nT) * (LEN + 2000) - 1000, side = i % 2 ? 1 : -1, x = side * (riverHalf(y) * 14 + 1.5 + Math.random() * 6), z = toZ(y), s = 0.8 + Math.random() * 0.6;
      M4.compose(new T3.Vector3(x, 1.5 * s, z), new T3.Quaternion(), new T3.Vector3(s, s, s)); cone.setMatrixAt(i, M4); M4.compose(new T3.Vector3(x, 0.4 * s, z), new T3.Quaternion(), new T3.Vector3(s, s, s)); trunk.setMatrixAt(i, M4); }
    world.add(cone); world.add(trunk);
    // いわ
    for (const r of G.rocks) { const m = V.mesh(new T3.DodecahedronGeometry(r.r / 100 * 1.1, 0), '#8a8580', { ink: 0.06 }); m.position.set(toX(r.x), 0.05, toZ(r.y)); m.rotation.set(Math.random(), Math.random(), 0); m.scale.y = 0.7; world.add(m); }
    // ゴール
    const gz = toZ(LEN);
    for (const s of [-1, 1]) { const pole = V.mesh(new T3.CylinderGeometry(0.12, 0.12, 4, 8), '#ffffff', { ink: 0.1 }); pole.position.set(s * (riverHalf(LEN) * 14 + 0.3), 2, gz); world.add(pole); }
    const ban = new T3.Mesh(new T3.PlaneGeometry(riverHalf(LEN) * 28 + 0.6, 1), new T3.MeshBasicMaterial({ map: checkerTex(), side: T3.DoubleSide })); ban.position.set(0, 3.5, gz); world.add(ban);
    // ボート
    for (const b of G.boats) {
      const g = new T3.Group();
      const hullShape = new T3.Shape(); hullShape.moveTo(0, -0.7); hullShape.quadraticCurveTo(0.42, -0.3, 0.36, 0.55); hullShape.lineTo(-0.36, 0.55); hullShape.quadraticCurveTo(-0.42, -0.3, 0, -0.7);
      const hull = V.mesh(new T3.ExtrudeGeometry(hullShape, { depth: 0.28, bevelEnabled: false }), '#c98a4a', { ink: 0.06 }); hull.rotation.x = Math.PI / 2; hull.position.y = 0.3; g.add(hull);
      const p1 = V.mesh(new T3.SphereGeometry(0.17, 16, 12), b.color, { ink: 0.1 }); p1.position.set(-0.15, 0.48, 0.05); g.add(p1);
      const p2 = V.mesh(new T3.SphereGeometry(0.17, 16, 12), b.color2, { ink: 0.1 }); p2.position.set(0.15, 0.48, 0.05); g.add(p2);
      const oars = {};
      for (const s of ['L', 'R']) { const dir = s === 'L' ? -1 : 1, piv = new T3.Group(); piv.position.set(dir * 0.3, 0.35, 0); const shaft = V.mesh(new T3.CylinderGeometry(0.03, 0.03, 1.0, 6), '#7a4a2a', { ink: 0 }); shaft.rotation.z = Math.PI / 2; shaft.position.x = dir * 0.5; piv.add(shaft);
        const blade = V.mesh(new T3.BoxGeometry(0.28, 0.03, 0.14), '#d9a46a', { ink: 0.15 }); blade.position.set(dir * 0.98, 0, 0); piv.add(blade); g.add(piv); oars[s] = piv; }
      world.add(g); boatG.set(b, { g, oars });
    }
  }
  function ripple(x, z) { const m = new T3.Mesh(new T3.RingGeometry(0.2, 0.28, 24), new T3.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.8 })); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.04, z); world.add(m); ripples.push({ m, t: 0 }); }
  function drawScene() {
    const W = S.W, H = S.H;
    if (built !== G) build3D();
    const lead = G.boats.reduce((a, b) => b.y > a.y ? b : a, G.boats[0]);
    for (const b of G.boats) {
      const o = boatG.get(b); if (!o) continue;
      o.g.position.set(toX(b.x), Math.sin(api.t * 3 + b.y) * 0.03, toZ(b.y)); o.g.rotation.y = -b.a; o.g.rotation.z = Math.sin(api.t * 2) * 0.03;
      for (const s of ['L', 'R']) { const dir = s === 'L' ? -1 : 1, sw = b.oar[s]; o.oars[s].rotation.y = dir * (-0.6 + sw * 1.2); o.oars[s].rotation.z = dir * (sw > 0.2 ? 0.05 : -0.25); }
      if (b.v > 150 && Math.random() < 0.06) ripple(toX(b.x) + (Math.random() - 0.5) * 0.6, toZ(b.y) + 0.8);
    }
    for (const r of ripples) { r.t += 1 / 60; r.m.scale.setScalar(1 + r.t * 3); r.m.material.opacity = Math.max(0, 0.8 - r.t * 0.7); }
    ripples = ripples.filter(r => { if (r.t > 1.2) { world.remove(r.m); return false; } return true; });
    const cxp = toX(lead.x) * 0.6, cz = toZ(lead.y);
    V.camera.position.set(cxp, 7.5, cz + 8.5); V.camera.lookAt(cxp, 0, cz - 6);
    V.render();
    cx.clearRect(0, 0, W, H);
    // 2D: なまえ・ふきだし
    for (const b of G.boats) {
      const [x, y, vis] = V.toScreen(toX(b.x), 1.3, toZ(b.y));
      if (vis && y < H) { D.text(b.crew.map(p => p.name).join('・'), x, y, H * 0.032, '#fff', 'center', INK); if (b.done) D.text('ゴール！', x, y - H * 0.06, H * 0.05, '#ffd23f', 'center', INK); }
      else if (!b.done) { const [bx] = V.toScreen(toX(b.x), 0, cz + 4); D.text('↓ ' + b.crew.map(p => p.name).join('・') + ' おいつけ！', Math.max(120, Math.min(W - 120, bx)), H - 80, H * 0.035, b.color, 'center', '#fff'); }
    }
    for (const q of G.pops) { const u = q.t / 0.9, [x, y] = V.toScreen(toX(q.b.x), 2, toZ(q.b.y)); cx.globalAlpha = 1 - u * u; D.text(q.txt, x, y - u * 40, H * (q.good ? 0.055 : 0.045), q.good ? '#ffd23f' : '#fff', 'center', INK); cx.globalAlpha = 1; }
    const bh = H * 0.7, bx = W - 40, by = H * 0.15; cx.fillStyle = '#fff'; D.rr(bx - 8, by, 16, bh, 8); cx.fill(); cx.lineWidth = 3; cx.strokeStyle = INK; cx.stroke();
    for (const b of G.boats) { const u = Math.min(1, b.y / LEN); cx.fillStyle = b.color; cx.beginPath(); cx.arc(bx, by + bh * (1 - u), 13, 0, Math.PI * 2); cx.fill(); cx.stroke(); }
    D.text('ゴール', bx, by - 18, H * 0.028, '#fff', 'center', INK);
  }
  window.__game = api; window.__end = () => { for (const b of G.boats) { b.y = LEN + 1; b.x = 0; } };
}
</script>
